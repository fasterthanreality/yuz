</style></head><body><header class="header"><a class="brand" href="/">← YUZ / ATLAS</a></header> <section class="contact-section" aria-labelledby="contactTitle"><p class="eyebrow">YUZ / CONTACT</p><h2 id="contactTitle">Get in touch.</h2><p>Artists, listeners, labels, curious minds. Tell us what’s on yours.</p><form id="contactForm"><label>Name<input name="name" autocomplete="name" maxlength="100" required></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Message<textarea name="message" minlength="10" maxlength="4000" rows="5" required></textarea></label><div class="contact-trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="hint">Your details are used to reply to your enquiry. Messages are delivered through Resend to YUZ at fasterthanreality. Please don’t include sensitive information.</p><button type="submit">Send message ↗</button><p id="contactStatus" role="status" aria-live="polite"></p></form></section><script>
(()=>{const form=document.getElementById('contactForm'),status=document.getElementById('contactStatus');let token=null;const loadToken=()=>fetch('/api/contact').then(r=>r.ok?r.json():Promise.reject()).then(d=>token=d.token).catch(()=>token=null);loadToken();form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Sending…';try{if(!token)await loadToken();if(!token)throw new Error('Contact is temporarily unavailable. Please try again later.');const fields=Object.fromEntries(new FormData(form));const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...fields,token})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to send. Please try again.');status.textContent='Thank you — your message has been sent.';form.reset();loadToken();}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});})();
</script><script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script defer src="/_vercel/insights/script.js"></script></body></html>
